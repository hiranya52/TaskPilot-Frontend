<div class="flex flex-col w-full">

  <div class="flex justify-between items-center mb-3">
    <h2 class="font-bold text-lg">{{ title }}</h2>
    <span class="text-sm bg-gray-200 px-2 py-1 rounded-full">
      {{ tasks.length }}
    </span>
  </div>

  <div class="space-y-3">
    <app-task-card
      *ngFor="let task of tasks"
      [task]="task"
    ></app-task-card>
  </div>

</div>
