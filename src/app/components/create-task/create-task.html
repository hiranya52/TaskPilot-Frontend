<div>
  <div class="px-container-margin py-6 border-b border-outline-variant flex items-center justify-between">
    <h3 class="font-headline-md text-headline-md text-on-surface">Create New Task</h3>
    <button
      class="text-on-surface-variant hover:text-on-surface transition-colors p-2 hover:bg-surface-container rounded-full"
      onclick="closeModal()">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <form class="px-container-margin py-8 space-y-6" id="createTaskForm">
    <!-- Task Title -->
    <div class="space-y-1">
      <label class="block font-label-md text-label-md text-on-surface-variant" for="taskTitle">Task Title</label>
      <input
        class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-container outline-none transition-all font-body-md text-body-md placeholder:text-outline-variant"
        id="taskTitle" placeholder="e.g. Design Landing Page" type="text">
    </div>
    <!-- Description -->
    <div class="space-y-1">
      <label class="block font-label-md text-label-md text-on-surface-variant" for="description">Description</label>
      <textarea
        class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-container outline-none transition-all font-body-md text-body-md placeholder:text-outline-variant resize-none"
        id="description" placeholder="Briefly describe the task objectives..." rows="4"></textarea>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-column-gap">
      <!-- Priority Dropdown -->
      <div class="space-y-1">
        <label class="block font-label-md text-label-md text-on-surface-variant" for="priority">Priority</label>
        <div class="relative">
          <select
            class="w-full appearance-none px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-container outline-none transition-all font-body-md text-body-md bg-white"
            id="priority">
            <option value="low">Low</option>
            <option selected="" value="medium">Medium</option>
            <option value="high">High</option>
          </select>
          <span
            class="material-symbols-outlined absolute right-4 top-3.5 pointer-events-none text-outline">expand_more</span>
        </div>
      </div>
      <!-- Due Date -->
      <div class="space-y-1">
        <label class="block font-label-md text-label-md text-on-surface-variant" for="dueDate">Due Date</label>
        <input
          class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-container outline-none transition-all font-body-md text-body-md"
          id="dueDate" type="date">
      </div>
    </div>
    <!-- Assignee Dropdown -->
    <div class="space-y-1">
      <label class="block font-label-md text-label-md text-on-surface-variant" for="assignee">Assignee</label>
      <div class="relative">
        <select
          class="w-full appearance-none px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-container outline-none transition-all font-body-md text-body-md bg-white"
          id="assignee">
          <option value="none">Unassigned</option>
          <option value="user1">Alex Rivera (Product Designer)</option>
          <option value="user2">Sarah Chen (Lead Dev)</option>
          <option value="user3">Marcus Thorne (QA Analyst)</option>
        </select>
        <span
          class="material-symbols-outlined absolute right-4 top-3.5 pointer-events-none text-outline">person_search</span>
      </div>
    </div>
    <!-- Modal Footer Actions -->
    <div class="pt-6 flex flex-col-reverse md:flex-row gap-4">
      <button
        class="flex-1 md:flex-none px-8 py-3 rounded-xl border border-outline-variant text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container transition-colors"
        onclick="closeModal()" type="button">
        Cancel
      </button>
      <button
        class="flex-1 md:flex-auto px-8 py-3 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg shadow-lg shadow-primary/20 hover:opacity-90 active:scale-95 transition-all"
        type="submit">
        Save Task
      </button>
    </div>
  </form>

</div>
